GEOIP,CN,🔒 国内服务

RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global.list,🌍 非中国

FINAL,🐟 漏网之鱼

