[Rule]

# WebRTC 防泄露：STUN / TURN（UDP 3478、5349）和 Google STUN（UDP 19302-19309）
# 目标是国内 IP 时直连（微信、钉钉等音视频通话），其余拒绝，防止网页通过 WebRTC 暴露真实 IP
AND,((PROTOCOL,UDP),(DST-PORT,3478),(GEOIP,CN)),DIRECT
AND,((PROTOCOL,UDP),(DST-PORT,5349),(GEOIP,CN)),DIRECT
AND,((PROTOCOL,UDP),(DST-PORT,19302-19309),(GEOIP,CN)),DIRECT
AND,((PROTOCOL,UDP),(DST-PORT,3478)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,5349)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,19302-19309)),REJECT

# 局域网 / 私有地址直连（IP 规则均带 no-resolve，不会触发 DNS 解析，可放最前）
