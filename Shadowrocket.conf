# blackmatrix7 ChinaMax（官方说明：包含 China、ChinaIPs、Mainland 等全部国内规则，取代原 China.list / China_Domain.list）
# 按 blackmatrix7 说明，引用 ChinaMax 后不再叠加其他国内规则（已移除 Loyalsoldier direct / cncidr），兜底由下方 GEOIP,CN 负责
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list,DIRECT

# ===== 🌐 境外代理：域名（不在上方分组里的境外服务统一走 PROXY，即首页选中的节点）=====
# 放在 ChinaMax 之后：Loyalsoldier proxy.txt 与 ChinaMax 有约 190 个重合（学术期刊、阿里云国际站等），国内可直连，优先直连
# blackmatrix7 Global（境外服务合集）
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global_Domain.list,PROXY
# Loyalsoldier proxy.txt（含 gfw.txt 全部域名，约 2.7 万条，比 Global 多约 400 条）
DOMAIN-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/proxy.txt,PROXY
# blackmatrix7 GlobalMedia（境外流媒体，比 Global 多约 170 条）
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia_Domain.list,PROXY

# ===== 以下规则含 IP，会触发 DNS 解析，所以放在所有域名规则之后 =====
# 国内直连：关键字 / User-Agent / IP（blackmatrix7 ChinaMax.list）
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax.list,DIRECT
# 境外代理：关键字 / User-Agent / IP
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global.list,PROXY
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia.list,PROXY
# Telegram IP 段补充（Loyalsoldier telegramcidr.txt，比 blackmatrix7 Telegram.list 多 3 段）
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/telegramcidr.txt,PROXY

GEOIP,CN,DIRECT

