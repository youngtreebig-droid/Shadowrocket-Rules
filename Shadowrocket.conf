# ===== 🎵 TikTok：广告拦截的例外（必须放在 🤖 AI 服务、🛑 广告拦截之前）=====
# Loyalsoldier reject 会拦 TikTok 的私信接口 imapi-sg.isnssdk.com、长连接 frontier.musical.ly、网络调度 tnc16-*.isnssdk.com、
